<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Medical Familie</title>
    <!-- Google Identity Services pentru autentificare Drive -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
        /* Tema Deschisă - Curată, minimalistă */
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --card-bg: #ffffff;
        --primary-color: #2563eb; /* Albastru profesional */
        --primary-hover: #1d4ed8;
        --secondary-color: #e2e8f0;
        --secondary-text: #64748b;
        --border-color: #e2e8f0;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-pill: 50px;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* Tema Întunecată - Premium, Slate-Blue */
    [data-theme="dark"] {
        --bg-color: #0f172a; 
        --text-color: #f8fafc;
        --card-bg: #1e293b;
        --primary-color: #3b82f6; 
        --primary-hover: #60a5fa;
        --secondary-color: #334155;
        --secondary-text: #94a3b8;
        --border-color: #334155;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
    
    header { 
        background-color: var(--card-bg); 
        color: var(--text-color); 
        padding: 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        box-shadow: var(--shadow);
        border-bottom: 1px solid var(--border-color);
    }
    header h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    .header-icons { display: flex; gap: 15px; align-items: center; }
    .header-icons svg { width: 26px; height: 26px; fill: var(--secondary-text); cursor: pointer; transition: 0.2s; }
    .header-icons svg:hover { fill: var(--primary-color); }
    .drive-status.synced { fill: #10b981 !important; filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.4)); }

    .profile-selector { 
        display: flex; gap: 12px; padding: 20px; 
        overflow-x: auto; 
        background: var(--bg-color);
        scrollbar-width: none; /* Firefox */
    }
    .profile-selector::-webkit-scrollbar { display: none; /* Chrome */ }
    
    .profile-btn { 
        padding: 10px 24px; 
        border-radius: var(--radius-pill); 
        border: 1px solid var(--border-color); 
        background: var(--card-bg); 
        color: var(--secondary-text); 
        cursor: pointer; 
        white-space: nowrap;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .profile-btn.active { 
        background: var(--primary-color); 
        color: white; 
        border-color: var(--primary-color); 
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .tabs { 
        display: flex; 
        background: var(--bg-color); 
        padding: 0 15px 15px 15px;
        gap: 10px;
        overflow-x: auto; 
        scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    
    .tab-btn { 
        flex: 1; 
        padding: 14px 15px; 
        border: none; 
        border-radius: var(--radius-md);
        background: transparent; 
        cursor: pointer; 
        color: var(--secondary-text); 
        min-width: 100px;
        font-weight: 600;
        transition: all 0.2s;
    }
    .tab-btn.active { 
        background: var(--card-bg); 
        color: var(--primary-color); 
        box-shadow: var(--shadow);
    }

    .content { padding: 15px; }
    .card { 
        background: var(--card-bg); 
        padding: 22px; 
        border-radius: var(--radius-lg); 
        box-shadow: var(--shadow); 
        margin-bottom: 20px; 
        border: 1px solid var(--border-color); 
        transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-header h4 { font-size: 1.15rem; margin-right: 10px; color: var(--text-color); font-weight: 600; }
    
    .status-badge { 
        padding: 6px 12px; 
        border-radius: var(--radius-pill); 
        font-size: 11px; 
        font-weight: 700; 
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    .status-active { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .status-resolved { background: rgba(16, 185, 129, 0.15); color: #10b981; }

    button.action-btn { 
        background: var(--primary-color); 
        color: white; 
        border: none; 
        padding: 16px 20px; 
        border-radius: var(--radius-md); 
        cursor: pointer; 
        width: 100%; 
        font-size: 16px; 
        font-weight: 600;
        margin-top: 15px; 
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        transition: background 0.2s;
    }
    button.action-btn:hover { background: var(--primary-hover); }

    /* Modal Setări */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 30px; border-radius: var(--radius-lg); width: 90%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
    .modal-content h3 { margin-bottom: 25px; font-size: 1.4rem; color: var(--text-color); }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--secondary-text); }
    .input-group input[type="text"], .input-group input[type="password"] { 
        width: 100%; padding: 14px; border: 1px solid var(--border-color); 
        border-radius: var(--radius-md); background: var(--bg-color); 
        color: var(--text-color); font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--primary-color); }
    
    .close-modal { background: var(--secondary-color); color: var(--text-color); border: none; padding: 14px 20px; border-radius: var(--radius-md); cursor: pointer; width: 100%; margin-top: 10px; font-weight: 600; transition: 0.2s; }
    .close-modal:hover { opacity: 0.8; }
    
    /* Checkbox modern pentru Dark Mode */
    .input-group input[type="checkbox"] { accent-color: var(--primary-color); width: 18px; height: 18px; vertical-align: middle; margin-right: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>Jurnal Medical</h2>
        <div class="header-icons">
            <!-- Iconiță Google Drive -->
            <svg id="drive-icon" onclick="conectareDrive()" viewBox="0 0 24 24"><path d="M7.71,3.5L1.15,15L4.58,21L11.13,9.5M9.73,15L6.3,21H19.42L22.85,15M22.28,14L15.72,2.5H8.85L15.41,14H22.28Z" /></svg>
            <!-- Iconiță Setări -->
            <svg onclick="deschideSetari()" viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" /></svg>
        </div>
    </header>

    <div class="profile-selector" id="profile-selector">
        <!-- Profilurile vor fi generate aici din JS -->
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="schimbaTab('afectiuni')">Afecțiuni</button>
        <button class="tab-btn" onclick="schimbaTab('vizite')">Vizite Med.</button>
        <button class="tab-btn" onclick="schimbaTab('analize')">Analize</button>
    </div>

    <div class="content" id="main-content">
        <!-- Conținutul generat dinamic -->
    </div>

    <!-- Modal Setări -->
    <div class="modal" id="modal-setari">
        <div class="modal-content">
            <h3>Setări Aplicație</h3>
            <div class="input-group">
                <label>Nume Membri (separate prin virgulă)</label>
                <input type="text" id="setare-nume" value="Roxana, Ionuț, Soție">
            </div>
            <div class="input-group">
                <label>Google Client ID</label>
                <input type="text" id="setare-client-id" placeholder="12345...apps.googleusercontent.com">
            </div>
            <div class="input-group">
                <label>ID Folder Drive</label>
                <input type="text" id="setare-folder-id" placeholder="ID-ul folderului partajat">
            </div>
            <div class="input-group">
                <label>Cheie API Gemini (AI)</label>
                <input type="password" id="setare-gemini" placeholder="AI Studio Key">
            </div>
            <div class="input-group">
                <label>
                    <input type="checkbox" id="setare-dark-mode" onchange="toggleDarkMode()"> Tema Întunecată
                </label>
            </div>
            <button class="action-btn" onclick="salveazaSetari()">Salvează Setările</button>
            <button class="close-modal" onclick="inchideSetari()">Închide</button>
        </div>
    </div>

    <script>
        // --- 1. STRUCTURA DE DATE ---
        const DB_FILE_NAME = 'Baza_Date_Jurnal_Medical.json';
        let appData = {
            membri: ["Roxana", "Ionuț", "Soție"],
            profilActiv: "Roxana",
            inregistrari: {
                "Roxana": { afectiuni: [], vizite: [], analize: [] },
                "Ionuț": { afectiuni: [], vizite: [], analize: [] },
                "Soție": { afectiuni: [], vizite: [], analize: [] }
            }
        };

        let driveFileId = null;
        let tokenClient;

        // --- 2. GOOGLE DRIVE API LOGIC ---
        function initGoogleAuth() {
            const clientId = localStorage.getItem('google_client_id');
            if (!clientId) return;

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://www.googleapis.com/auth/drive',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        localStorage.setItem('google_access_token', tokenResponse.access_token);
                        document.getElementById('drive-icon').classList.add('synced');
                        sincronizeazaDinDrive(); // Descărcăm datele imediat după logare
                    }
                }
            });
        }

        function conectareDrive() {
            const clientId = localStorage.getItem('google_client_id');
            const folderId = localStorage.getItem('drive_folder_id');
            
            if (!clientId || !folderId) {
                alert("Te rog introdu Client ID-ul și ID-ul Folderului în Setări!");
                deschideSetari();
                return;
            }
            if (!tokenClient) initGoogleAuth();
            tokenClient.requestAccessToken();
        }

        async function sincronizeazaDinDrive() {
            const token = localStorage.getItem('google_access_token');
            const folderId = localStorage.getItem('drive_folder_id');
            if (!token || !folderId) return false;

            try {
                // Căutăm fișierul
                const query = encodeURIComponent(`name='${DB_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
                const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const searchData = await searchRes.json();

                if (searchData.files && searchData.files.length > 0) {
                    driveFileId = searchData.files[0].id;
                    // Descărcăm conținutul
                    const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const dbContent = await fileRes.json();
                    
                    appData = dbContent;
                    localStorage.setItem('jurnal_medical_data', JSON.stringify(appData));
                    incarcaInterfata();
                    alert("Datele au fost descărcate din Drive cu succes!");
                    return true;
                } else {
                    // Dacă nu există, îl creăm prima dată
                    await incarcaInDrive(true);
                    return true;
                }
            } catch (e) {
                console.error("Eroare la sincronizare:", e);
                alert("Eroare la conectarea cu Drive. Jurnalul va rula local.");
                return false;
            }
        }

        async function incarcaInDrive(isNew = false) {
            const token = localStorage.getItem('google_access_token');
            const folderId = localStorage.getItem('drive_folder_id');
            if (!token || !folderId) return;

            const fileMetadata = { name: DB_FILE_NAME };
            if (isNew) fileMetadata.parents = [folderId]; // Adăugăm parent doar la creare
            
            const fileContent = new Blob([JSON.stringify(appData)], { type: 'application/json' });
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';

            if (!isNew && driveFileId) {
                url = `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`;
                method = 'PATCH';
            }

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(fileMetadata)], { type: 'application/json' }));
            form.append('file', fileContent);

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: form
                });
                const data = await res.json();
                if (isNew) driveFileId = data.id;
            } catch (e) {
                console.error("Eroare la salvare în Drive:", e);
            }
        }

        // --- 3. LOGICA LOCALĂ ---
        function salveazaLocal() {
            localStorage.setItem('jurnal_medical_data', JSON.stringify(appData));
            // De fiecare dată când salvăm local (ex: adăugăm o afecțiune), trimitem și în Drive dacă suntem logați
            if (localStorage.getItem('google_access_token')) {
                incarcaInDrive();
            }
        }

        function incarcaLocal() {
            const dateSalvate = localStorage.getItem('jurnal_medical_data');
            if (dateSalvate) {
                appData = JSON.parse(dateSalvate);
            } else {
                // Punem niște date de test la prima rulare absolută
                appData.inregistrari["Roxana"].afectiuni.push({
                    id: Date.now(),
                    nume: "Răceală sezonieră",
                    status: "activ",
                    dataStart: "2026-10-25"
                });
                salveazaLocal();
            }
            aplicaTema();
            incarcaInterfata();
        }

        // --- 4. INTERFAȚĂ ȘI SETĂRI ---
        function incarcaInterfata() {
            // Generare butoane profil
            const profSelector = document.getElementById('profile-selector');
            profSelector.innerHTML = '';
            appData.membri.forEach(membru => {
                const btn = document.createElement('button');
                btn.className = `profile-btn ${membru === appData.profilActiv ? 'active' : ''}`;
                btn.innerText = membru;
                btn.onclick = () => { appData.profilActiv = membru; salveazaLocal(); incarcaInterfata(); schimbaTab('afectiuni'); };
                profSelector.appendChild(btn);
            });
            schimbaTab('afectiuni'); // Default tab
        }

        function schimbaTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                // Adăugăm clasa 'active' doar pe butonul corespunzător tab-ului selectat
                if(btn.getAttribute('onclick').includes(tab)) {
                    btn.classList.add('active');
                }
            });
            
            const content = document.getElementById('main-content');
            const persoana = appData.inregistrari[appData.profilActiv];

            if(tab === 'afectiuni') {
                let html = `<h3>Afecțiuni - ${appData.profilActiv}</h3>`;
                if(persoana.afectiuni.length === 0) html += `<p>Nicio afecțiune înregistrată.</p>`;
                persoana.afectiuni.forEach(af => {
                    html += `
                    <div class="card">
                        <div class="card-header">
                            <h4>${af.nume}</h4>
                            <span class="status-badge ${af.status === 'activ' ? 'status-active' : 'status-resolved'}">${af.status.toUpperCase()}</span>
                        </div>
                        <p><strong>De la:</strong> ${af.dataStart}</p>
                    </div>`;
                });
                html += `<button class="action-btn" onclick="adaugaAfectiuneTest()">+ Adaugă Afecțiune</button>`;
                content.innerHTML = html;
            } else {
                content.innerHTML = `<h3>Secțiune în lucru...</h3><p>Aici vom implementa logica pentru ${tab}.</p>`;
            }
        }

        function adaugaAfectiuneTest() {
            appData.inregistrari[appData.profilActiv].afectiuni.push({
                id: Date.now(),
                nume: "Simptom Test",
                status: "activ",
                dataStart: new Date().toISOString().split('T')[0]
            });
            salveazaLocal();
            schimbaTab('afectiuni');
        }

        // Modal Setări
        function deschideSetari() {
            document.getElementById('setare-nume').value = appData.membri.join(', ');
            document.getElementById('setare-client-id').value = localStorage.getItem('google_client_id') || '';
            document.getElementById('setare-folder-id').value = localStorage.getItem('drive_folder_id') || '';
            document.getElementById('setare-gemini').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('setare-dark-mode').checked = localStorage.getItem('dark_mode') === 'true';
            document.getElementById('modal-setari').style.display = 'flex';
        }

        function inchideSetari() {
            document.getElementById('modal-setari').style.display = 'none';
        }

        function salveazaSetari() {
            const numeNoi = document.getElementById('setare-nume').value.split(',').map(n => n.trim());
            appData.membri = numeNoi;
            if(!appData.membri.includes(appData.profilActiv)) appData.profilActiv = appData.membri[0];
            
            // Asigurăm structura pentru toți membrii
            appData.membri.forEach(m => {
                if(!appData.inregistrari[m]) appData.inregistrari[m] = { afectiuni: [], vizite: [], analize: [] };
            });

            localStorage.setItem('google_client_id', document.getElementById('setare-client-id').value.trim());
            localStorage.setItem('drive_folder_id', document.getElementById('setare-folder-id').value.trim());
            localStorage.setItem('gemini_api_key', document.getElementById('setare-gemini').value.trim());
            
            salveazaLocal();
            initGoogleAuth(); // Reinițializăm auth în caz că s-a schimbat ID-ul
            inchideSetari();
            incarcaInterfata();
        }

        function toggleDarkMode() {
            const isDark = document.getElementById('setare-dark-mode').checked;
            localStorage.setItem('dark_mode', isDark);
            aplicaTema();
        }

        function aplicaTema() {
            if (localStorage.getItem('dark_mode') === 'true') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        // --- INIT ---
        window.onload = () => {
            incarcaLocal();
            setTimeout(initGoogleAuth, 1000); // Lăsăm scriptul Google să se încarce
        };
    </script>
</body>
</html>
